# Pentest workstation with Kali
services:
    kali_master:
        build: ./kali
        image: kali
        hostname: kali_master
        container_name: kali_master
        networks:
            net-main_network:
                ipv4_address: 192.168.0.5
        volumes:
            - ./kali/tmp_script:/root/scripts
        command: bash -c "
                    service ssh start &&
                    tail -f /dev/null"
                    
# Network configuration
networks:
    net-main_network:
        # Contain the benchmark network:
        # host->kali and kali<->targets works, however kali->LAN->internet is blocked.
        internal: true
        ipam:
            config:
                - subnet: 192.168.0.0/16